# Based on templates/dependabot.yml in jakefrenzel/engineering-standards.
# Go modules, GitHub Actions, and the Next.js template's npm packages.

version: 2

updates:
  - package-ecosystem: gomod
    directories: [/, /tools]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /templates/nextjs
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
