# Formatting, lint, types, unit tests, and end-to-end tests for the Next.js
# template in templates/nextjs. The Go module's checks are in go.yml.
#
# Kept in this repo rather than the shared web.yml: the template has its own
# package.json (no root workspace), and its end-to-end tests run against
# examples/api and a fresh Postgres.
# See: standards/ci.md in jakefrenzel/engineering-standards

name: template

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No path filters: this check is required in branch protection, and a
    # workflow skipped by a path filter never reports, so the PR would wait
    # forever. Public repo, so the extra runs cost no Actions minutes.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: templates/nextjs
    services:
      # The end-to-end tests run the template against examples/api and a
      # fresh database.
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: templates/nextjs/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: templates/nextjs/.node-version
          cache: pnpm
          cache-dependency-path: templates/nextjs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgres://postgres@localhost:5432/e2e?sslmode=disable

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: templates/nextjs/test-results
          retention-days: 7
