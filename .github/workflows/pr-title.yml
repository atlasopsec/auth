# Checks that the PR title follows Conventional Commits.
# The title becomes the squash commit message on main, so it's the one that matters.
# Copy to .github/workflows/pr-title.yml in each project.
# See: standards/git-workflow.md in jakefrenzel/engineering-standards

name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    # Dependabot's titles are machine-generated ("chore(deps): Bump ...") and
    # capitalize the summary, so they're skipped. A skipped required check
    # still counts as passing.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            style
            revert
          requireScope: false
          # Summary must not start with an uppercase letter
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The summary "{subject}" must start with a lowercase letter.
