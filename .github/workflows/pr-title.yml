# Checks that the PR title follows Conventional Commits.
# The title becomes the squash commit message on main, so it's the one that matters.
#
# A short caller: it decides when to run, and the shared workflow in
# atlasopsec/workflows decides what runs. Call it by major tag, never @main.
# Copy to .github/workflows/pr-title.yml in each project.
# See: standards/ci.md in jakefrenzel/engineering-standards

name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: atlasopsec/workflows/.github/workflows/pr-title.yml@v1
