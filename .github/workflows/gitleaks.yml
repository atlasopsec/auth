# Scans the full git history for committed secrets.
# Findings that aren't real secrets go in .gitleaksignore at the repo root.
#
# A short caller: it decides when to run, and the shared workflow in
# atlasopsec/workflows decides what runs. Call it by major tag, never @main.
# Copy to .github/workflows/gitleaks.yml in each project.
# See: standards/ci.md in jakefrenzel/engineering-standards

name: gitleaks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    uses: atlasopsec/workflows/.github/workflows/gitleaks.yml@v1
