# The endpoints served by Auth.Register. Projects can merge these paths into
# their own api/openapi.yaml. See docs/api.md for the design.
openapi: 3.1.0
info:
  title: atlasopsec/auth
  version: 0.1.0
  description: Sign up, log in, and session management.

paths:
  /v1/users:
    post:
      operationId: signUp
      summary: Sign up
      description: >
        Creates an account and emails a verification link. By default
        (verify first) the response is `202` whether or not the email
        already has an account, and the owner of an existing account is
        emailed instead. With `AllowUnverifiedLogin`, the user is logged in
        immediately (`201`), and an existing email returns `409`.
      tags: [users]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Account created and logged in (`AllowUnverifiedLogin` only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "202":
          description: Verification email sent (the default).
          content:
            application/json:
              schema:
                type: object
                required: [verification_required]
                properties:
                  verification_required: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: "`email_taken`: an account already uses this email (`AllowUnverifiedLogin` only)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/me:
    get:
      operationId: getCurrentUser
      summary: The logged-in user
      tags: [users]
      responses:
        "200":
          description: The logged-in user, with their 2FA status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/sessions:
    post:
      operationId: logIn
      summary: Log in
      description: >
        Unknown emails, wrong passwords, and accounts without a password
        all get the same `invalid_credentials` response, in the same time.
        After 5 wrong passwords for an email from one IP, or 20 from
        anywhere within an hour, each further failure makes the next
        attempt wait, from 1 second doubling to 15 minutes; an attempt that
        comes too early gets `429` without the password being checked.
        Unknown emails are slowed down the same way.
        For a user with 2FA, a correct password returns a challenge instead
        of a session; finish with `POST /v1/two-factor-challenges/verify`.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200": { $ref: "#/components/responses/TwoFactorChallenge" }
        "201":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_credentials`: the email or password is incorrect."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: >
            `email_not_verified`: the password is correct, but the email isn't
            verified yet (verify first only).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listSessions
      summary: My active sessions
      description: Most recently used first. Not paginated; `next_cursor` is always null.
      tags: [sessions]
      responses:
        "200":
          description: The user's active sessions.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SessionInfo" }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TwoFactorSetupRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: logOutEverywhere
      summary: Log out everywhere
      description: Ends every session the user has, including the current one.
      tags: [sessions]
      responses:
        "204": { description: Logged out everywhere. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TwoFactorSetupRequired" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/email-verifications:
    post:
      operationId: requestEmailVerification
      summary: Send a new verification link
      description: >
        Always `202`, whether or not the email has an account. A link is
        sent only to an existing, unverified account, at most once a minute.
      tags: [email-verifications]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: Accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/email-verifications/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Verify an email and log in
      description: >
        Takes the token from the verification link (the part after
        `#token=`) and the account's password. After 5 wrong passwords the
        token stops working. For a user with 2FA, it verifies the email and
        returns a challenge instead of a session.
      tags: [email-verifications]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password, client]
              properties:
                token: { type: string }
                password: { type: string }
                client: { type: string, enum: [web, mobile] }
      responses:
        "200": { $ref: "#/components/responses/TwoFactorChallenge" }
        "201":
          description: Verified and logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_credentials`: wrong password."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: >
            `token_invalid_or_expired` for a bad, used, or expired token, or
            `validation_failed` for missing fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/password-resets:
    post:
      operationId: requestPasswordReset
      summary: Send a password reset link
      description: >
        Always `202`, whether or not the email has an account. A link is
        sent only to an existing account, at most once a minute.
      tags: [password-resets]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: Accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/password-resets/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password from a reset link
      description: >
        Takes the token from the reset link (the part after `#token=`).
        Sets the password, marks the email verified, ends every session,
        and emails a notice. Doesn't log the user in. When the user has 2FA
        it also needs a code; without one the response is `422` with
        `code: required`, and the page should ask for it and send again. A
        wrong code counts toward the link's 5 failed attempts.
      tags: [password-resets]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, description: 12 to 256 characters, not in a known breach. }
                code: { type: string, description: A TOTP code or a recovery code. Required when the user has 2FA. }
      responses:
        "204": { description: Password set. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/InvalidTwoFactorCode" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: >
            `token_invalid_or_expired` for a bad, used, or expired token, or
            `validation_failed` (`password`: `too_short`, `too_long`,
            `breached`; `code`: `required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/me/password:
    post:
      operationId: changePassword
      summary: Change my password
      description: Requires the current password. Ends every other session and emails a notice.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, description: 12 to 256 characters, not in a known breach. }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/PasswordNotSet" }
        "403": { $ref: "#/components/responses/TwoFactorSetupRequired" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: >
            `validation_failed`: `current_password` is `required` or
            `incorrect`, or `new_password` is `too_short`, `too_long`, or
            `breached`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/email-changes:
    post:
      operationId: requestEmailChange
      summary: Start changing my email
      description: >
        Requires the current password and a verified email. Sends a
        confirmation link to the new address. Answers `202` even if the new
        address belongs to another account; that account's owner is emailed
        instead. At most one link a minute.
      tags: [email-changes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, current_password]
              properties:
                email: { type: string, maxLength: 254 }
                current_password: { type: string }
      responses:
        "202": { description: Accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/PasswordNotSet" }
        "403":
          description: >
            `email_not_verified`: verify the current email first, or
            `two_factor_setup_required`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: >
            `validation_failed`: `email` is `required`, `too_long`,
            `invalid_format`, or `unchanged`, or `current_password` is
            `required` or `incorrect`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/email-changes/confirm:
    post:
      operationId: confirmEmailChange
      summary: Finish changing my email
      description: >
        Takes the token from the link sent to the new address (the part
        after `#token=`). Switches the email, ends every session, cancels
        links sent to the old address, and emails the old address.
      tags: [email-changes]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Email changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: >
            `token_invalid_or_expired` for a bad, used, or expired token, or
            if the address was taken since the link was sent;
            `validation_failed` for a missing token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/organizations:
    post:
      operationId: createOrganization
      summary: Create an organization
      description: >
        The creator becomes its owner. Requires a verified email. Not
        available when the app sets `DisableOrganizationCreation`.
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationName" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`email_not_verified`: verify your email first, or `two_factor_setup_required`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listOrganizations
      summary: My organizations
      description: With my role in each. Not paginated; `next_cursor` is always null.
      tags: [organizations]
      responses:
        "200":
          description: The user's organizations.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TwoFactorSetupRequired" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/organizations/{id}:
    parameters:
      - { $ref: "#/components/parameters/OrganizationIDPath" }
    get:
      operationId: getOrganization
      summary: One of my organizations
      tags: [organizations]
      responses:
        "200":
          description: The organization, with my role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TwoFactorSetupRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: renameOrganization
      summary: Rename an organization
      description: Requires `organization:update`.
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationName" }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/organizations/{id}/members:
    parameters:
      - { $ref: "#/components/parameters/OrganizationIDPath" }
    get:
      operationId: listMembers
      summary: An organization's members
      description: In the order they joined. Requires `members:read`.
      tags: [members]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
                  next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/organizations/{id}/members/{user_id}:
    parameters:
      - { $ref: "#/components/parameters/OrganizationIDPath" }
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: changeMemberRole
      summary: Change a member's role
      description: >
        Requires `members:manage`. You can only give a role whose
        permissions you all have, and only change the role of someone whose
        permissions you all have. Only owners can make or change owners.
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string }
      responses:
        "200":
          description: The member, with their new role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LastOwner" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: removeMember
      summary: Remove a member, or leave
      description: >
        With your own user ID, leaves the organization. Removing someone
        else requires `members:manage` and follows the same rules as
        changing their role.
      tags: [members]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LastOwner" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/organizations/{id}/invitations:
    parameters:
      - { $ref: "#/components/parameters/OrganizationIDPath" }
    post:
      operationId: invite
      summary: Invite someone by email
      description: >
        Requires `members:manage`, and you can only invite to a role whose
        permissions you all have (only owners invite owners). Emails a link
        that works for 7 days. Inviting the same address again replaces the
        earlier invitation; within a minute, it returns the existing
        invitation without sending another email.
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, maxLength: 254 }
                role: { type: string }
      responses:
        "201":
          description: Invitation sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_member`: that address already belongs to a member."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listInvitations
      summary: Pending invitations
      description: Unaccepted and unexpired, oldest first. Requires `members:manage`.
      tags: [invitations]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of invitations.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
                  next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/organizations/{id}/invitations/{invitation_id}:
    parameters:
      - { $ref: "#/components/parameters/OrganizationIDPath" }
      - name: invitation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: cancelInvitation
      summary: Cancel a pending invitation
      description: Requires `members:manage`, and the same role rule as inviting.
      tags: [invitations]
      responses:
        "204": { description: Cancelled. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: >
        Takes the token from the invitation link (the part after
        `#token=`). The logged-in user's verified email must match the
        invited address.
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Joined. The organization, with the new member's role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: >
            `invitation_email_mismatch` (sent to a different address),
            `email_not_verified`, or `two_factor_setup_required`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`already_member`: you're already a member."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            `token_invalid_or_expired` for a bad, used, cancelled, or expired
            invitation, or `validation_failed` for a missing token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/me/two-factor:
    post:
      operationId: startTwoFactor
      summary: Start setting up 2FA
      description: >
        Returns a new secret for the user's authenticator app, as text and
        as an `otpauth://` URI for a QR code. 2FA isn't on until confirmed.
        Starting again replaces a pending secret.
      tags: [two-factor]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrentPassword" }
      responses:
        "201":
          description: Setup started.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret: { type: string, description: Base32, for typing in by hand. }
                  otpauth_uri: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: disableTwoFactor
      summary: Turn off 2FA
      description: >
        Needs the current password and a code (TOTP or recovery). Users
        who must have 2FA can't.
      tags: [two-factor]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrentPasswordAndCode" }
      responses:
        "204": { description: 2FA is off. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: >
            `two_factor_required`: 2FA is required for this user, or
            `two_factor_setup_required`: it's required and not set up yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/me/two-factor/confirm:
    post:
      operationId: confirmTwoFactor
      summary: Turn 2FA on
      description: >
        With a working code from the authenticator app. Returns the
        recovery codes, the only time they're shown.
      tags: [two-factor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/me/two-factor/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace recovery codes
      description: Needs the current password and a code. The old codes stop working.
      tags: [two-factor]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrentPasswordAndCode" }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TwoFactorSetupRequired" }
        "409": { $ref: "#/components/responses/TwoFactorConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/oauth-flows:
    post:
      operationId: startOAuthFlow
      summary: Start signing in with Google or GitHub
      description: >
        Returns the provider URL to send the user to. The client keeps a
        random `client_verifier` (in an `HttpOnly` cookie on the web, in
        memory on mobile) and sends its SHA-256 as `client_challenge`; only
        it can finish the flow. The provider redirects to
        `{AppURL}/oauth/callback` (web) or `{AppURL}/oauth/callback/mobile`
        (mobile) with `code` and `state`. A flow works once, for 10 minutes.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, client, client_challenge]
              properties:
                provider:
                  type: string
                  enum: [google, github]
                  description: Only providers turned on in `Config.OAuth` are accepted.
                client: { type: string, enum: [web, mobile] }
                client_challenge:
                  type: string
                  description: Base64url (no padding) SHA-256 of the client verifier.
      responses:
        "201":
          description: Flow started.
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, expires_at]
                properties:
                  authorization_url: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/oauth-flows/complete:
    post:
      operationId: completeOAuthFlow
      summary: Finish signing in with Google or GitHub
      description: >
        With the `code` and `state` from the provider's redirect, and the
        client verifier. Signs in the account linked to the provider
        account; otherwise, if the provider says the email is verified,
        the account with that email (taking back one whose email was never
        verified) or a new account without a password. Users with 2FA get
        a challenge instead of a session. A flow started with
        `POST /v1/users/me/oauth-accounts` links the provider instead, and
        needs the same user's session.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, code, client_verifier]
              properties:
                state: { type: string }
                code: { type: string }
                client_verifier: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TwoFactorChallenge" }
        "201":
          description: Logged in, or, for a link flow, the linked account.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/LoginResponse" }
                  - { $ref: "#/components/schemas/OAuthAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: >
            `oauth_failed`: the flow is unknown, used, or expired, the client
            verifier doesn't match, or the provider refused the code. Start
            again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: >
            `oauth_email_not_verified`: the provider doesn't vouch for the
            email address, and no account is linked yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            Link flows only: `oauth_account_in_use` (the provider account is
            linked to another user) or `oauth_already_linked` (the user
            linked another account with this provider meanwhile).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/apple-sign-ins:
    post:
      operationId: appleSignIn
      summary: Sign in with Apple, from the iOS app
      description: >
        Native Sign in with Apple only; Apple isn't offered on the web or
        Android. The app generates a random nonce, gives Apple its hex
        SHA-256, and sends the nonce itself with the identity token from
        the Apple sheet. The account rules are the same as for
        `POST /v1/oauth-flows/complete`, and the session is a mobile one.
        Answers `404` when Apple isn't turned on.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identity_token, nonce]
              properties:
                identity_token: { type: string }
                nonce: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TwoFactorChallenge" }
        "201":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`oauth_failed`: the token or nonce didn't check out."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: >
            `oauth_email_not_verified`: Apple doesn't vouch for the email
            address, and no account is linked yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/me/oauth-accounts:
    get:
      operationId: listOAuthAccounts
      summary: List my linked sign-in providers
      tags: [sessions]
      responses:
        "200":
          description: The linked accounts, oldest first. At most one per provider, so there's never a next page.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OAuthAccount" }
                  next_cursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TwoFactorSetupRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: startLink
      summary: Start linking a sign-in provider
      description: >
        Like `POST /v1/oauth-flows`, plus the current password if the
        account has one. Finish with `POST /v1/oauth-flows/complete`, sent
        with the same session. The user is emailed when it's linked.
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, client, client_challenge]
              properties:
                provider: { type: string, enum: [google, github] }
                client: { type: string, enum: [web, mobile] }
                client_challenge: { type: string }
                current_password: { type: string, description: Required if the account has a password. }
      responses:
        "201":
          description: Flow started.
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, expires_at]
                properties:
                  authorization_url: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TwoFactorSetupRequired" }
        "409":
          description: "`oauth_already_linked`: an account with this provider is already linked."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/users/me/oauth-accounts/{id}:
    delete:
      operationId: unlink
      summary: Unlink a sign-in provider
      description: >
        Needs the current password if the account has one. The user is
        emailed when it's removed.
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                current_password: { type: string, description: Required if the account has a password. }
      responses:
        "204": { description: Unlinked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TwoFactorSetupRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `last_login_method`: it's the only way left to log in. Set a
            password or link another provider first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/two-factor-challenges/verify:
    post:
      operationId: verifyTwoFactorChallenge
      summary: Finish logging in with 2FA
      description: >
        With the challenge from the password step and a TOTP or recovery
        code. A challenge works for 5 minutes and 5 wrong codes; after
        that, log in with the password again. Using a recovery code emails
        the user how many are left.
      tags: [sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_token, code]
              properties:
                challenge_token: { type: string }
                code: { type: string, description: A TOTP code or a recovery code. }
      responses:
        "201":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: >
            `invalid_two_factor_code` for a wrong code, or
            `two_factor_challenge_invalid` for a bad, used, or expired
            challenge, or one with 5 wrong codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/sessions/current:
    delete:
      operationId: logOut
      summary: Log out
      tags: [sessions]
      responses:
        "204": { description: Logged out. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/sessions/{id}:
    delete:
      operationId: endSession
      summary: End one of my sessions
      tags: [sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/TwoFactorSetupRequired" }
        "404":
          description: "`not_found`: no such session, or it belongs to someone else."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

security:
  - session: []

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: >
        The session token from sign-up or login. Next.js reads it from the
        __Host-session cookie; mobile apps from secure storage.

  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password, client]
      properties:
        email: { type: string, maxLength: 254, example: ada@example.com }
        password:
          type: string
          description: 12 to 256 characters when signing up.
        client: { type: string, enum: [web, mobile] }

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }

    OrganizationName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }

    Organization:
      type: object
      required: [id, name, role, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, description: "The caller's role in it." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Invitation:
      type: object
      required: [id, email, role, invited_by, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        invited_by: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    Member:
      type: object
      required: [user_id, email, role, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        joined_at: { type: string, format: date-time }

    CurrentUser:
      allOf:
        - { $ref: "#/components/schemas/User" }
        - type: object
          required: [two_factor_enabled, two_factor_required]
          properties:
            two_factor_enabled: { type: boolean }
            two_factor_required:
              type: boolean
              description: Whether the user must have 2FA, from their roles or `SetTwoFactorRequired`.

    CurrentPassword:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password: { type: string }

    CurrentPasswordAndCode:
      type: object
      additionalProperties: false
      required: [current_password, code]
      properties:
        current_password: { type: string }
        code: { type: string, description: A TOTP code or a recovery code. }

    User:
      type: object
      required: [id, email, email_verified, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }

    LoginResponse:
      type: object
      required: [user, token, expires_at, absolute_expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        token:
          type: string
          description: The session token. Returned only here; it can't be recovered later.
        expires_at:
          type: string
          format: date-time
          description: >
            When the session ends if it isn't used. Using it pushes this
            forward, except for users with a privileged role
            (`Config.TwoFactorRoles`), whose sessions end 12 hours after
            login.
        absolute_expires_at:
          type: string
          format: date-time
          description: >
            The latest the session can last, however often it's used: 90
            days after login, or 12 hours for privileged users. The web
            app's session cookie lasts until then.

    OAuthAccount:
      type: object
      required: [id, provider, email, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [google, github, apple] }
        email:
          type: string
          description: The provider's address when linked, for display. Empty if the provider gave none.
        created_at: { type: string, format: date-time }

    SessionInfo:
      type: object
      required: [id, client, ip, user_agent, last_used_at, expires_at, created_at, is_current]
      properties:
        id: { type: string, format: uuid }
        client: { type: string, enum: [web, mobile] }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        is_current:
          type: boolean
          description: Whether this is the session making the request.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details:
              type: [array, "null"]
              items:
                type: object
                required: [field, code, message]
                properties:
                  field: { type: string }
                  code:
                    type: string
                    enum: [required, invalid_format, invalid_value, too_short, too_long, breached, incorrect, unchanged]
                  message: { type: string }

  parameters:
    OrganizationIDPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` from the previous page.
      schema: { type: string }
    OrganizationID:
      name: X-Organization-ID
      in: header
      required: true
      description: >
        The organization the request is for. Required on every route behind
        `RequireOrg`; projects reference this parameter from their own API
        docs. A missing or malformed value returns `400 bad_request`, and an
        organization the user isn't a member of returns `404 not_found`.
      schema: { type: string, format: uuid }

  responses:
    RecoveryCodes:
      description: The new recovery codes. They're only shown here.
      content:
        application/json:
          schema:
            type: object
            required: [recovery_codes]
            properties:
              recovery_codes:
                type: array
                minItems: 10
                maxItems: 10
                items: { type: string, example: ABCD-EFGH-IJKL-MNOP }
    TwoFactorSetupRequired:
      description: >
        `two_factor_setup_required`: the user must have 2FA (a role in
        `Config.TwoFactorRoles`, or `SetTwoFactorRequired`) and hasn't set
        it up. Until they do, they can only set it up, read
        `GET /v1/users/me`, and log out. Every route behind `Authenticated`,
        `Require`, or `RequireOrg`, the project's own included, can return
        this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TwoFactorChallenge:
      description: >
        The password is correct, and the user has 2FA. Send the challenge
        and a code to `POST /v1/two-factor-challenges/verify`.
      content:
        application/json:
          schema:
            type: object
            required: [two_factor_required, challenge_token, expires_at]
            properties:
              two_factor_required: { type: boolean, const: true }
              challenge_token:
                type: string
                description: Proves the password step. Keep it secret, like a session token.
              expires_at: { type: string, format: date-time }
    InvalidTwoFactorCode:
      description: "`invalid_two_factor_code`: the code is wrong or was already used."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: >
        `rate_limited`: too many requests from this IP or to this address,
        too many wrong 2FA codes (10 in 15 minutes pause a user's code
        checks), a login attempt that came before the delay after repeated
        failures was over, or 10 wrong current passwords in an hour on the
        logged-in endpoints. Try again after `Retry-After` seconds. See docs/api.md §10 for the limits.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PasswordNotSet:
      description: >
        `password_not_set`: the endpoint needs the current password, but the
        account has none (it signs in only with Google or GitHub). Offer to
        set one with a password reset.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TwoFactorConflict:
      description: >
        `two_factor_already_enabled`, `two_factor_not_enabled`, or
        `two_factor_setup_not_started`. Endpoints that take the current
        password can also answer `password_not_set` (see `PasswordNotSet`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >
        `forbidden`: logged in, but the user's role doesn't grant the
        permission the route requires (`Require` or `RequireOrg`). Or
        `two_factor_setup_required`, as below.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LastOwner:
      description: "`last_owner`: the organization would be left without an owner."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: >
        `not_found`: doesn't exist, or the user isn't allowed to know it
        exists (e.g. an organization they aren't a member of).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
